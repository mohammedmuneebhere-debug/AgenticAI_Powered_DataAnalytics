services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: socialiq-postgres
    environment:
      POSTGRES_USER: socialiq
      POSTGRES_PASSWORD: socialiq
      POSTGRES_DB: socialiq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: socialiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5-community
    container_name: socialiq-neo4j
    environment:
      NEO4J_AUTH: neo4j/socialiq123
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  n8n:
    image: n8nio/n8n:latest
    container_name: socialiq-n8n
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: socialiq123
      WEBHOOK_URL: http://localhost:5678/
      X_BEARER_TOKEN: ${X_BEARER_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../workflows/n8n:/workflows
    depends_on:
      - postgres
      - redis

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: socialiq-backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
      - ../agents:/app/agents
      - ../ml:/app/ml
      - ../graph:/app/graph
      - ../blockchain:/app/blockchain
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: socialiq-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  n8n_data:
